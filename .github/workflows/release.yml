name: Release

# Publishes to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing, so no token is stored in GitHub. One-time setup on pypi.org:
#   gutenbergpy -> Manage -> Publishing -> Add a new publisher -> GitHub
#   owner: raduangelescu, repository: gutenbergpy, workflow: release.yml, environment: pypi

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test
        run: |
          python -m pip install .[test]
          python -m pytest
      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then echo "tag $GITHUB_REF_NAME does not match setup.cfg version $version"; exit 1; fi
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gutenbergpy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
