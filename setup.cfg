[metadata]
name= gutenbergpy
author= Radu Angelescu
author_email = raduangelescu@gmail.com
version = 0.4.0
description = Library to create and interogate local cache for Project Gutenberg
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/raduangelescu/gutenbergpy
download_url = http://pypi.python.org/pypi/gutenbergpy
project_urls =
    Bug Tracker = https://github.com/raduangelescu/gutenbergpy/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
license = MIT
license_files = LICENSE.txt

[options]
install_requires =
        lxml>=3.2.0
        pymongo
        chardet
python_requires = >=3.6

[options.extras_require]
test =
        pytest
